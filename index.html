<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Slides</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#e9ebee;--panel:#fff;--ink:#1c1f26;--muted:#6b7280;--line:#d9dce2;--accent:#b5412a;--accent-ink:#fff;--hover:#f6ece9;--ui:"IBM Plex Sans",system-ui,sans-serif}
:root[data-theme="dark"]{--bg:#17191e;--panel:#22252c;--ink:#e7e9ee;--muted:#9aa1ad;--line:#363a44;--accent:#e2694f;--hover:#3a2b27}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;border-radius:6px;padding:6px 8px;line-height:1}button:hover{background:var(--hover)}
button.on{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:6px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:600;display:flex;align-items:center;gap:8px}.brand i{width:22px;height:22px;border-radius:5px;background:var(--accent);display:inline-block}
#title{border:1px solid transparent;border-radius:6px;padding:5px 8px;min-width:200px;font-weight:500;background:transparent}#title:hover,#title:focus{border-color:var(--line);background:var(--panel)}
.menu{position:relative}.menu ul{position:absolute;top:100%;left:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);list-style:none;margin:4px 0 0;padding:6px;min-width:220px;display:none;z-index:50}
.menu.open ul{display:block}.menu li button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:16px;padding:7px 10px}.menu li button kbd{color:var(--muted);font-size:12px}.menu li.sep{border-top:1px solid var(--line);margin:6px 0}
.status{margin-left:auto;color:var(--muted);font-size:13px;display:flex;gap:12px;align-items:center}
.present{background:var(--accent);color:var(--accent-ink);padding:7px 14px;font-weight:500}.present:hover{background:var(--accent);filter:brightness(1.1)}
.toolbar{background:var(--panel);border-bottom:1px solid var(--line);padding:4px 10px;display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-height:40px}
.toolbar .g{display:flex;align-items:center;gap:1px;padding:0 6px;border-right:1px solid var(--line)}.toolbar .g:last-child{border:0}
.toolbar button{min-width:30px;height:30px;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.toolbar button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toolbar select{height:30px}.toolbar .lbl{font-size:12px;color:var(--muted);padding:0 4px}
.colorbtn{position:relative}.colorbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}.colorbtn .bar{position:absolute;left:7px;right:7px;bottom:4px;height:3px;border-radius:2px}
main{flex:1;display:flex;overflow:hidden}
.filmstrip{width:200px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px}
.thumb{position:relative;margin-bottom:10px;cursor:pointer;border:2px solid transparent;border-radius:6px;padding:3px}
.thumb.active{border-color:var(--accent)}.thumb .n{position:absolute;left:-2px;top:-2px;font-size:11px;color:var(--muted);background:var(--panel);padding:1px 5px;border-radius:4px}
.thumb .tv{width:100%;aspect-ratio:16/9;background:#fff;border:1px solid var(--line);border-radius:3px;overflow:hidden;position:relative;pointer-events:none}
.thumb .tv .slide{transform-origin:0 0;position:absolute;left:0;top:0}
.thumb.drag{opacity:.4}
.stage{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px}
.slide{touch-action:none;width:960px;height:540px;background:#fff;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.2),0 14px 40px rgba(0,0,0,.12);transform-origin:center;flex:none;font-family:var(--ui)}
.el{position:absolute;box-sizing:border-box;user-select:none}
.el.text{padding:8px 12px;overflow:hidden;word-wrap:break-word;white-space:pre-wrap;line-height:1.3}
.el.text .ed{outline:none;width:100%;height:100%;overflow:hidden}
.el.shape svg{width:100%;height:100%;display:block;overflow:visible}
.el.image img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.el.video{background:#000}.el.video iframe,.el.video video{width:100%;height:100%;border:0;pointer-events:none}#show .el.video iframe,#show .el.video video{pointer-events:auto}.el.shape .st{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;pointer-events:none;white-space:pre-wrap}.el.icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.sn{position:absolute;bottom:14px;font-size:12px;opacity:.7;pointer-events:none}.sguide{position:absolute;background:#e2694f;pointer-events:none;z-index:9}#show .el[data-link]{cursor:pointer}
.el.sel{outline:2px solid var(--accent);outline-offset:0}
.el.sel .h{position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--accent);border-radius:2px;z-index:5}
.h.nw{left:-6px;top:-6px;cursor:nwse-resize}.h.ne{right:-6px;top:-6px;cursor:nesw-resize}.h.sw{left:-6px;bottom:-6px;cursor:nesw-resize}.h.se{right:-6px;bottom:-6px;cursor:nwse-resize}
.h.n{left:calc(50% - 5px);top:-6px;cursor:ns-resize}.h.s{left:calc(50% - 5px);bottom:-6px;cursor:ns-resize}.h.w{left:-6px;top:calc(50% - 5px);cursor:ew-resize}.h.e{right:-6px;top:calc(50% - 5px);cursor:ew-resize}
.h.rot{left:calc(50% - 5px);top:-30px;border-radius:50%;cursor:grab}
.notes{height:110px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
.notes label{font-size:12px;color:var(--muted);padding:6px 12px 0}
.notes textarea{flex:1;border:0;resize:none;background:transparent;padding:4px 12px;outline:none}
.props{width:230px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px;font-size:13px}
.props h3{font-size:12px;color:var(--muted);margin:10px 0 6px;font-weight:600}.props h3:first-child{margin-top:0}
.props .row{display:flex;gap:6px;margin-bottom:6px;align-items:center}.props .row label{width:46px;color:var(--muted)}.props .row input,.props .row select{flex:1;min-width:0}
.props .full{width:100%;margin-bottom:6px}
.props .empty{color:var(--muted);line-height:1.5}
.sw{display:flex;gap:6px;flex-wrap:wrap}.sw button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);padding:0}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:6px}.themes button{height:44px;border-radius:6px;border:1px solid var(--line);font-size:11px;text-align:left;padding:6px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px 22px;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 12px;font-size:16px}dialog label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}dialog input,dialog select{width:100%}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}dialog .actions .primary{background:var(--accent);color:var(--accent-ink);padding:7px 14px}
.layouts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.layouts button{border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;text-align:left}.layouts button .pv{aspect-ratio:16/9;background:#f3f4f6;position:relative}.layouts button .pv i{position:absolute;background:#cbd0d9;border-radius:2px}.layouts button span{display:block;padding:6px 8px;font-size:12px}
.shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.shapes button{aspect-ratio:1;border:1px solid var(--line);border-radius:6px;padding:8px}.shapes svg{width:100%;height:100%;fill:var(--muted)}
#show{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:100;cursor:none}#show.on{display:flex}
#show .slide{box-shadow:none}
#show .hud{position:absolute;bottom:14px;right:18px;color:#aaa;font-size:14px;font-family:var(--ui);cursor:default}
#show .laser{position:absolute;width:12px;height:12px;border-radius:50%;background:#ff2d2d;box-shadow:0 0 12px #ff2d2d;pointer-events:none;display:none;z-index:5}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}.toast.show{opacity:1}
.ctx{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;display:none;z-index:60;min-width:180px}.ctx.show{display:block}.ctx button{width:100%;text-align:left;padding:7px 10px;font-size:13px}
@media (max-width:1000px){
  body{padding-top:env(safe-area-inset-top)}
  header{padding:6px 8px;gap:6px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}header::-webkit-scrollbar{display:none}
  .brand span{display:none}#title{min-width:110px;width:130px;flex:none}.status #saved{display:none}.present{padding:7px 10px}
  .menu > button{white-space:nowrap}.menu ul{position:fixed;left:8px;right:8px;top:auto;max-height:70vh;overflow:auto;font-size:15px}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:4px 6px}.toolbar::-webkit-scrollbar{display:none}.toolbar .g{flex:none}.toolbar button{min-width:36px;height:36px;font-size:16px}
  main{flex-direction:column}
  .filmstrip{width:100%;height:92px;order:3;border-right:0;border-top:1px solid var(--line);display:flex;gap:8px;padding:8px;overflow-x:auto;overflow-y:hidden;flex:none}
  .thumb{margin:0;flex:none;width:128px}.thumb .tv{aspect-ratio:16/9}
  .stage{order:1;flex:1;min-height:0}.canvasWrap{padding:8px;overflow:hidden}
  .notes{height:auto;max-height:90px}.notes textarea{min-height:40px}
  .props{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:60vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);z-index:45;transform:translateY(100%);transition:transform .2s;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .props.open{transform:none}
  .props::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 10px}
  #propsBtn{display:inline-flex!important}
  dialog{width:94vw;max-width:94vw;padding:16px}dialog input,dialog select,input,select{font-size:16px}
  .ctx{min-width:220px}.ctx button{padding:11px 12px;font-size:15px}
  .h{width:18px!important;height:18px!important}.h.nw{left:-10px!important;top:-10px!important}.h.ne{right:-10px!important;top:-10px!important}.h.sw{left:-10px!important;bottom:-10px!important}.h.se{right:-10px!important;bottom:-10px!important}.h.n,.h.s{left:calc(50% - 9px)!important}.h.w,.h.e{top:calc(50% - 9px)!important}.h.rot{top:-40px!important;left:calc(50% - 9px)!important}
}
#propsBtn{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;inset:0;display:block!important}#printArea .slide{page-break-after:always;transform:none!important;box-shadow:none;margin:0 auto}}
@page{size:landscape;margin:0}
</style>
</head>
<body>
<header>
  <div class="brand"><i></i><span>Slides</span></div>
  <input id="title" placeholder="Untitled presentation" spellcheck="false">
  <div class="menu" id="m-file"><button>File</button><ul>
    <li><button data-cmd="new">New presentation</button></li>
    <li><button data-cmd="open">Open project (.slides.json)</button></li>
    <li><button data-cmd="import-pptx">Import PowerPoint (.pptx)…</button></li>
    <li><button data-cmd="save-json">Save project (.slides.json)</button></li>
    <li class="sep"></li>
    <li><button data-cmd="export-pptx">Download as PowerPoint (.pptx)</button></li>
    <li><button data-cmd="export-pdf">Print / Save as PDF</button></li>
    <li><button data-cmd="export-png">Export current slide as image</button></li>
    <li><button data-cmd="export-html">Download as standalone HTML show</button></li>
    <li class="sep"></li>
    <li><button data-cmd="rename">Rename</button></li>
    <li><button data-cmd="delete-pres">Delete presentation</button></li>
  </ul></div>
  <div class="menu" id="m-edit"><button>Edit</button><ul>
    <li><button data-cmd="undo">Undo <kbd>Ctrl+Z</kbd></button></li><li><button data-cmd="redo">Redo <kbd>Ctrl+Y</kbd></button></li>
    <li class="sep"></li>
    <li><button data-cmd="copy">Copy <kbd>Ctrl+C</kbd></button></li><li><button data-cmd="paste">Paste <kbd>Ctrl+V</kbd></button></li><li><button data-cmd="duplicate">Duplicate <kbd>Ctrl+D</kbd></button></li><li><button data-cmd="delete">Delete <kbd>Del</kbd></button></li>
    <li class="sep"></li>
    <li><button data-cmd="select-all">Select all <kbd>Ctrl+A</kbd></button></li>
  </ul></div>
  <div class="menu" id="m-insert"><button>Insert</button><ul>
    <li><button data-cmd="add-text">Text box</button></li>
    <li><button data-cmd="add-image">Image…</button></li>
    <li><button data-cmd="shapes">Shape…</button></li>
    <li><button data-cmd="add-line">Line</button></li>
    <li><button data-cmd="add-table">Table…</button></li>
    <li><button data-cmd="add-chart">Chart…</button></li>
    <li><button data-cmd="add-icon">Icon…</button></li>
    <li><button data-cmd="add-video">Video (YouTube / file URL)…</button></li>
    <li><button data-cmd="add-link">Link / action on selected object…</button></li>
    <li><button data-cmd="slidenum">Slide numbers &amp; footer…</button></li>
    <li class="sep"></li>
    <li><button data-cmd="new-slide">New slide <kbd>Ctrl+M</kbd></button></li>
    <li><button data-cmd="layouts">New slide from layout…</button></li>
    <li><button data-cmd="dup-slide">Duplicate slide</button></li>
  </ul></div>
  <div class="menu" id="m-slide"><button>Slide</button><ul>
    <li><button data-cmd="slide-up">Move slide up</button></li><li><button data-cmd="slide-down">Move slide down</button></li>
    <li><button data-cmd="del-slide">Delete slide</button></li>
    <li class="sep"></li>
    <li><button data-cmd="trans-none">Transition: none</button></li><li><button data-cmd="trans-fade">Transition: fade</button></li><li><button data-cmd="trans-slide">Transition: slide</button></li><li><button data-cmd="trans-zoom">Transition: zoom</button></li>
    <li class="sep"></li>
    <li><button data-cmd="apply-theme-all">Apply theme to all slides</button></li>
  </ul></div>
  <div class="menu" id="m-arrange"><button>Arrange</button><ul>
    <li><button data-cmd="front">Bring to front</button></li><li><button data-cmd="back">Send to back</button></li><li><button data-cmd="forward">Bring forward</button></li><li><button data-cmd="backward">Send backward</button></li>
    <li class="sep"></li>
    <li><button data-cmd="al-left">Align left</button></li><li><button data-cmd="al-center">Align center</button></li><li><button data-cmd="al-right">Align right</button></li><li><button data-cmd="al-top">Align top</button></li><li><button data-cmd="al-middle">Align middle</button></li><li><button data-cmd="al-bottom">Align bottom</button></li>
    <li class="sep"></li>
    <li><button data-cmd="dist-h">Distribute horizontally</button></li><li><button data-cmd="dist-v">Distribute vertically</button></li>
    <li><button data-cmd="group">Group <kbd>Ctrl+G</kbd></button></li><li><button data-cmd="ungroup">Ungroup</button></li>
  </ul></div>
  <div class="menu" id="m-tools"><button>Tools</button><ul>
    <li><button data-cmd="ai">AI assistant <kbd>Ctrl+J</kbd></button></li>
    <li><button data-cmd="ai-settings">AI settings…</button></li>
    <li class="sep"></li>
    <li><button data-cmd="outline">Create slides from outline…</button></li>
    <li><button data-cmd="autoplay">Autoplay slideshow…</button></li>
    <li><button data-cmd="rehearse">Rehearse with timer</button></li>

  <div class="menu" id="m-view"><button>View</button><ul>
    <li><button data-cmd="theme">Toggle dark mode</button></li><li><button data-cmd="grid">Toggle grid</button></li><li><button data-cmd="present-from">Present from current slide</button></li>
  </ul></div>
  <div class="status"><span id="saved">Saved</span><button id="propsBtn" title="Properties">⚙</button><button class="present" data-cmd="present">▶ Present</button></div>
</header>
<div class="toolbar" id="tb">
  <div class="g"><button data-cmd="undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button><button data-cmd="redo" title="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button></div>
  <div class="g"><select id="zoom"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="fit">Fit</option></select></div>
  <div class="g"><button data-cmd="add-text" title="Text box"><b>T</b></button><button data-cmd="add-image" title="Image"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></button><button data-cmd="shapes" title="Shapes"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="5"/><rect x="11" y="11" width="10" height="10" rx="1"/></svg></button><button data-cmd="add-line" title="Line"><svg viewBox="0 0 24 24"><path d="M4 20 20 4"/></svg></button><button data-cmd="add-table" title="Table"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button><button data-cmd="add-chart" title="Chart"><svg viewBox="0 0 24 24"><path d="M3 21h18M7 17V9M12 17V5M17 17v-7"/></svg></button></div>
  <div class="g" id="textTools">
    <select id="font"><option>IBM Plex Sans</option><option>Fraunces</option><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Courier New</option><option>Impact</option></select>
    <select id="fsize"><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option selected>24</option><option>28</option><option>32</option><option>36</option><option>44</option><option>54</option><option>66</option><option>80</option><option>96</option></select>
    <button data-cmd="bold" title="Bold"><b>B</b></button><button data-cmd="italic" title="Italic"><i>I</i></button><button data-cmd="underline" title="Underline"><u>U</u></button><button data-cmd="strikeThrough" title="Strike"><s>S</s></button>
    <span class="colorbtn"><button title="Text color">A<span class="bar" id="fcBar" style="background:#1c1f26"></span></button><input type="color" id="fc" value="#1c1f26"></span>
    <button data-cmd="justifyLeft" title="Left"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h12M3 18h16"/></svg></button><button data-cmd="justifyCenter" title="Center"><svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M4 18h16"/></svg></button><button data-cmd="justifyRight" title="Right"><svg viewBox="0 0 24 24"><path d="M3 6h18M9 12h12M5 18h16"/></svg></button>
    <button data-cmd="insertUnorderedList" title="Bullets"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button><button data-cmd="insertOrderedList" title="Numbers"><svg viewBox="0 0 24 24"><path d="M10 6h11M10 12h11M10 18h11"/><path d="M4 6h1v4M4 10h2"/></svg></button>
    <button data-cmd="rtl" title="RTL / LTR">RTL</button>
  </div>
</div>
<main>
  <div class="filmstrip" id="film"></div>
  <div class="stage">
    <div class="canvasWrap" id="wrap"><div class="slide" id="slide"></div></div>
    <div class="notes"><label>Speaker notes</label><textarea id="notes" placeholder="Notes for this slide (shown in presenter view, not on the slide)"></textarea></div>
  </div>
  <div class="props" id="props"></div>
</main>
<div id="show"><div class="laser" id="laser"></div><div class="hud" id="hud"></div></div>
<div id="printArea" style="display:none"></div>
<div class="ctx" id="ctx"></div>
<dialog id="dlg-layouts"><h3>New slide</h3><div class="layouts" id="layoutList"></div><div class="actions"><button data-close>Cancel</button></div></dialog>
<dialog id="dlg-shapes"><h3>Insert shape</h3><div class="shapes" id="shapeList"></div><div class="actions"><button data-close>Cancel</button></div></dialog>
<dialog id="dlg-table"><h3>Insert table</h3><div style="display:flex;gap:10px"><div style="flex:1"><label>Rows</label><input type="number" id="t-r" value="3" min="1" max="20"></div><div style="flex:1"><label>Columns</label><input type="number" id="t-c" value="3" min="1" max="10"></div></div><div class="actions"><button data-close>Cancel</button><button class="primary" id="t-ok">Insert</button></div></dialog>
<dialog id="dlg-chart"><h3>Insert chart</h3><label>Type</label><select id="c-type"><option value="bar">Bar</option><option value="line">Line</option><option value="pie">Pie</option></select><label>Title</label><input id="c-title" value="Sales by quarter"><label>Labels (comma separated)</label><input id="c-labels" value="Q1,Q2,Q3,Q4"><label>Values (comma separated)</label><input id="c-values" value="12,19,8,24"><div class="actions"><button data-close>Cancel</button><button class="primary" id="c-ok">Insert</button></div></dialog>
<dialog id="dlg-rename"><h3>Rename</h3><input id="rn"><div class="actions"><button data-close>Cancel</button><button class="primary" id="rn-ok">Rename</button></div></dialog>
<dialog id="dlg-presets"><h3>Your presentations</h3><div id="presList"></div><div class="actions"><button data-close>Close</button></div></dialog>
<input type="file" id="imgIn" accept="image/*" hidden><input type="file" id="pptxIn" accept=".pptx" hidden>
<dialog id="dlg-ai" style="max-width:640px"><h3>AI assistant</h3><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px" id="aiQuick"><button data-q="deck">Generate a whole deck about…</button><button data-q="slide">Add a slide about…</button><button data-q="notes">Write speaker notes for this slide</button><button data-q="improve">Improve the text on this slide</button><button data-q="shorten">Shorten this slide to key bullets</button><button data-q="translate">Translate this slide to Hebrew</button></div><textarea id="aiPrompt" rows="3" style="width:100%" placeholder="Describe the deck or the change, e.g. 'a 6-slide pitch for an RFID inventory system for fashion retail'"></textarea><div id="aiOut" style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;display:none;line-height:1.5;white-space:pre-wrap;font-size:13px"></div><div class="actions"><button data-close>Close</button><button id="aiRun" class="primary">Run</button><button id="aiApply" style="display:none">Apply</button></div></dialog>
<dialog id="dlg-aiset"></dialog>
<dialog id="dlg-outline"><h3>Slides from outline</h3><p>One slide per top-level line; indented lines (two spaces or a dash) become bullets.</p><textarea id="outlineText" rows="10" style="width:100%;font-family:monospace">Project kickoff
- Goals
- Timeline
Team
- Roles
- Contacts
Next steps</textarea><div class="actions"><button data-close>Cancel</button><button class="primary" id="outlineOk">Create slides</button></div></dialog>
<dialog id="dlg-icons"><h3>Icons</h3><div id="iconGrid" style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px"></div><div class="actions"><button data-close>Close</button></div></dialog>
<dialog id="dlg-link"><h3>Link / action</h3><label>When clicked during the show</label><select id="lk-type"><option value="">No action</option><option value="url">Open URL</option><option value="slide">Go to slide</option><option value="next">Next slide</option><option value="prev">Previous slide</option><option value="first">First slide</option><option value="last">Last slide</option></select><label>URL or slide number</label><input id="lk-val"><div class="actions"><button data-close>Cancel</button><button class="primary" id="lk-ok">Apply</button></div></dialog>
<dialog id="dlg-fx"><h3>Image effects</h3><label>Brightness</label><input type="range" id="fx-b" min="0" max="200" value="100"><label>Contrast</label><input type="range" id="fx-c" min="0" max="200" value="100"><label>Saturation</label><input type="range" id="fx-s" min="0" max="200" value="100"><label>Blur (px)</label><input type="range" id="fx-bl" min="0" max="10" value="0"><label>Grayscale</label><input type="range" id="fx-g" min="0" max="100" value="0"><label>Fit</label><select id="fx-fit"><option value="contain">Contain</option><option value="cover">Cover (crop to fill)</option><option value="fill">Stretch</option></select><div class="actions"><button id="fx-reset">Reset</button><button data-close>Close</button></div></dialog><input type="file" id="projIn" accept=".json" hidden>
<div class="toast" id="toast"></div>

<script>
/* ===== data ===== */
const THEMES={
  clean:{name:'Clean',bg:'#ffffff',fg:'#1c1f26',accent:'#b5412a',font:'IBM Plex Sans',hfont:'Fraunces'},
  ink:{name:'Ink',bg:'#15181f',fg:'#f2f3f5',accent:'#f0a35e',font:'IBM Plex Sans',hfont:'Fraunces'},
  sand:{name:'Sand',bg:'#f4ecd8',fg:'#3b3225',accent:'#8a5a2b',font:'Georgia',hfont:'Georgia'},
  ocean:{name:'Ocean',bg:'#0f3b5c',fg:'#ffffff',accent:'#7fd1e8',font:'IBM Plex Sans',hfont:'IBM Plex Sans'},
  forest:{name:'Forest',bg:'#e7efe6',fg:'#1f3a24',accent:'#2f7a3e',font:'Verdana',hfont:'Fraunces'},
  coral:{name:'Coral',bg:'#ffe9e1',fg:'#4a1f12',accent:'#d9480f',font:'IBM Plex Sans',hfont:'Fraunces'},
  night:{name:'Night',bg:'#1b1035',fg:'#eae6ff',accent:'#c084fc',font:'IBM Plex Sans',hfont:'IBM Plex Sans'},
  paper:{name:'Paper',bg:'#fbfaf5',fg:'#2b2b2b',accent:'#1e7f5c',font:'Georgia',hfont:'Fraunces'},
  slate:{name:'Slate',bg:'#2f3e4e',fg:'#f3f6fa',accent:'#f8c537',font:'Verdana',hfont:'Verdana'},
  mono:{name:'Mono',bg:'#f5f5f5',fg:'#111111',accent:'#111111',font:'Courier New',hfont:'Courier New'},
};
const SW=['#1c1f26','#ffffff','#b5412a','#e2694f','#f0a35e','#f4d35e','#2f7a3e','#7fd1e8','#2457c5','#6b3fa0','#e85d9a','#9aa1ad','#6b7280','#d9dce2','transparent'];
const DB='slides.presentations';const cmds={};
let pres=JSON.parse(localStorage.getItem(DB)||'[]'),cur=null,si=0,sel=[],clip=null,undo=[],redo=[],saveT,gridOn=false,zoom=1;
const uid=()=>Math.random().toString(36).slice(2,9);
const T=()=>THEMES[cur.theme]||THEMES.clean;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
function persist(){localStorage.setItem(DB,JSON.stringify(pres));}
function el(type,p){return Object.assign({id:uid(),type,x:80,y:80,w:400,h:120,rot:0,op:1},p);}
const LAYOUTS={
  title:{name:'Title',make:t=>[el('text',{x:80,y:170,w:800,h:120,html:'Presentation title',fs:54,bold:true,align:'center',font:t.hfont,color:t.fg}),el('text',{x:160,y:300,w:640,h:60,html:'Subtitle or author',fs:24,align:'center',color:t.accent})]},
  content:{name:'Title and content',make:t=>[el('text',{x:60,y:40,w:840,h:80,html:'Slide title',fs:40,bold:true,font:t.hfont,color:t.fg}),el('text',{x:60,y:140,w:840,h:340,html:'<ul><li>First point</li><li>Second point</li><li>Third point</li></ul>',fs:24,color:t.fg})]},
  two:{name:'Two columns',make:t=>[el('text',{x:60,y:40,w:840,h:80,html:'Slide title',fs:40,bold:true,font:t.hfont,color:t.fg}),el('text',{x:60,y:140,w:400,h:340,html:'<ul><li>Left column</li></ul>',fs:22,color:t.fg}),el('text',{x:500,y:140,w:400,h:340,html:'<ul><li>Right column</li></ul>',fs:22,color:t.fg})]},
  section:{name:'Section header',make:t=>[el('shape',{x:0,y:0,w:14,h:540,shape:'rect',fill:t.accent,stroke:'none'}),el('text',{x:80,y:200,w:800,h:100,html:'Section title',fs:48,bold:true,font:t.hfont,color:t.fg})]},
  blank:{name:'Blank',make:t=>[]},
  big:{name:'Big number',make:t=>[el('text',{x:80,y:120,w:800,h:200,html:'42%',fs:140,bold:true,align:'center',font:t.hfont,color:t.accent}),el('text',{x:160,y:340,w:640,h:60,html:'What the number means',fs:28,align:'center',color:t.fg})]},
  quote:{name:'Quote',make:t=>[el('text',{x:100,y:150,w:760,h:200,html:'“A memorable quote goes here.”',fs:40,italic:true,align:'center',font:t.hfont,color:t.fg}),el('text',{x:100,y:360,w:760,h:50,html:'— Attribution',fs:22,align:'center',color:t.accent})]},
  imgtext:{name:'Image and text',make:t=>[el('text',{x:60,y:40,w:840,h:80,html:'Slide title',fs:40,bold:true,font:t.hfont,color:t.fg}),el('shape',{x:60,y:140,w:400,h:340,shape:'rect',fill:'#e5e7eb',stroke:'none'}),el('text',{x:500,y:140,w:400,h:340,html:'Describe the image on the left. Click the grey box and use Insert → Image to replace it.',fs:22,color:t.fg})]},
  closing:{name:'Closing',make:t=>[el('text',{x:80,y:180,w:800,h:110,html:'Thank you',fs:64,bold:true,align:'center',font:t.hfont,color:t.fg}),el('text',{x:160,y:310,w:640,h:60,html:'questions@example.com',fs:24,align:'center',color:t.accent})]},
};
function newSlide(layout='content'){const s={id:uid(),els:LAYOUTS[layout].make(T()),notes:'',bg:null,trans:'fade'};return s;}
function newPres(name='Untitled presentation'){const p={id:uid(),name,theme:'clean',slides:[],updated:Date.now()};cur=p;p.slides.push(newSlide('title'));pres.unshift(p);persist();si=0;sel=[];render();renderFilm();}
function load(id){cur=pres.find(p=>p.id===id);if(!cur)return newPres();si=0;sel=[];localStorage.setItem('slides.last',id);document.getElementById('title').value=cur.name;render();renderFilm();}
function save(){if(!cur)return;cur.name=document.getElementById('title').value||'Untitled presentation';cur.updated=Date.now();persist();document.getElementById('saved').textContent='Saved';}
function changed(){document.getElementById('saved').textContent='Saving…';clearTimeout(saveT);saveT=setTimeout(save,500);}
function snap(){undo.push(JSON.stringify(cur.slides));if(undo.length>60)undo.shift();redo=[];}
function commit(){changed();renderFilm();}
const S=()=>cur.slides[si];

/* ===== render ===== */
const slide=document.getElementById('slide');
function slideHTML(s,forThumb=false){
  const t=T();const bg=s.bg||t.bg;let h='';
  [...s.els].forEach(e=>{h+=elHTML(e,t,forThumb);});
  const i=cur.slides.indexOf(s);if(cur.footer||cur.slideNums){h+=`<div class="sn" style="left:24px;color:${t.fg}">${esc(cur.footer||'')}</div>`+(cur.slideNums?`<div class="sn" style="right:24px;color:${t.fg}">${i+1} / ${cur.slides.length}</div>`:'');}
  return {bg,h};
}
function elHTML(e,t,forThumb){
  const st=`left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;transform:rotate(${e.rot||0}deg);opacity:${e.op??1};`;
  if(e.type==='text')return `<div class="el text" data-id="${e.id}" ${e.link?`data-link="${esc(e.link)}"`:''} style="${st}font-size:${e.fs}px;font-family:'${e.font||t.font}';color:${e.color||t.fg};text-align:${e.align||'left'};${e.bold?'font-weight:700;':''}${e.italic?'font-style:italic;':''}${e.fill&&e.fill!=='transparent'?'background:'+e.fill+';':''}${e.stroke&&e.stroke!=='none'?'border:'+(e.sw||2)+'px solid '+e.stroke+';':''}border-radius:${e.rad||0}px;${e.rtl?'direction:rtl;':''}"><div class="ed" ${forThumb?'':'contenteditable="false"'}>${e.html}</div></div>`;
  if(e.type==='image')return `<div class="el image" data-id="${e.id}" ${e.link?`data-link="${esc(e.link)}"`:''} style="${st}border-radius:${e.rad||0}px;overflow:hidden"><img src="${e.src}" draggable="false" style="object-fit:${e.fit||'contain'};filter:${e.fx||'none'}"></div>`;
  if(e.type==='shape')return `<div class="el shape" data-id="${e.id}" ${e.link?`data-link="${esc(e.link)}"`:''} style="${st}">${shapeSVG(e)}${e.text?`<div class="st" style="color:${e.tcolor||'#fff'};font-size:${e.tfs||20}px;font-family:'${e.font||t.font}'">${e.text}</div>`:''}</div>`;
  if(e.type==='video')return `<div class="el video" data-id="${e.id}" style="${st}">${/youtube|youtu\.be/.test(e.src)?`<iframe src="https://www.youtube.com/embed/${(e.src.match(/(?:v=|be\/)([\w-]{11})/)||[])[1]||''}?rel=0" allow="autoplay; fullscreen"></iframe>`:`<video src="${esc(e.src)}" controls></video>`}</div>`;
  if(e.type==='icon')return `<div class="el icon" data-id="${e.id}" style="${st}color:${e.color||t.accent}">${ICONS[e.icon]||''}</div>`;
  if(e.type==='table'){let r='';e.rows.forEach((row,i)=>{r+='<tr>'+row.map(c=>`<${i===0?'th':'td'} style="border:1px solid ${e.stroke||'#9aa1ad'};padding:6px 10px;${i===0?'background:'+(e.fill||t.accent)+';color:#fff;':''}">${c}</${i===0?'th':'td'}>`).join('')+'</tr>';});return `<div class="el table" data-id="${e.id}" style="${st}font-size:${e.fs||18}px;color:${e.color||t.fg};font-family:'${t.font}'"><table style="border-collapse:collapse;width:100%;height:100%;text-align:left">${r}</table></div>`;}
  if(e.type==='chart')return `<div class="el chart" data-id="${e.id}" style="${st}">${chartSVG(e,t)}</div>`;
  if(e.type==='group')return `<div class="el group" data-id="${e.id}" style="${st}">${e.els.map(c=>elHTML(c,t,forThumb)).join('')}</div>`;
  return '';
}
function shapeSVG(e){
  const f=e.fill||'#b5412a',s=e.stroke||'none',sw=e.sw||2,w=e.w,h=e.h;const a=`fill="${f}" stroke="${s}" stroke-width="${sw}" vector-effect="non-scaling-stroke"`;
  const P={rect:`<rect x="0" y="0" width="${w}" height="${h}" rx="${e.rad||0}" ${a}/>`,
    ellipse:`<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2}" ry="${h/2}" ${a}/>`,
    triangle:`<polygon points="${w/2},0 ${w},${h} 0,${h}" ${a}/>`,
    diamond:`<polygon points="${w/2},0 ${w},${h/2} ${w/2},${h} 0,${h/2}" ${a}/>`,
    arrow:`<polygon points="0,${h*.3} ${w*.7},${h*.3} ${w*.7},0 ${w},${h/2} ${w*.7},${h} ${w*.7},${h*.7} 0,${h*.7}" ${a}/>`,
    star:`<polygon points="${[...Array(10)].map((_,i)=>{const r=i%2?0.4:1,an=-Math.PI/2+i*Math.PI/5;return (w/2+Math.cos(an)*w/2*r).toFixed(1)+','+(h/2+Math.sin(an)*h/2*r).toFixed(1);}).join(' ')}" ${a}/>`,
    pentagon:`<polygon points="${[...Array(5)].map((_,i)=>{const an=-Math.PI/2+i*2*Math.PI/5;return (w/2+Math.cos(an)*w/2).toFixed(1)+','+(h/2+Math.sin(an)*h/2).toFixed(1);}).join(' ')}" ${a}/>`,
    hexagon:`<polygon points="${[...Array(6)].map((_,i)=>{const an=i*Math.PI/3;return (w/2+Math.cos(an)*w/2).toFixed(1)+','+(h/2+Math.sin(an)*h/2).toFixed(1);}).join(' ')}" ${a}/>`,
    line:`<line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="${e.stroke==='none'?f:s}" stroke-width="${sw}" ${e.arrow?'marker-end="url(#ah'+e.id+')"':''}/>${e.arrow?`<defs><marker id="ah${e.id}" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${e.stroke==='none'?f:s}"/></marker></defs>`:''}`,
    callout:`<path d="M0,0 H${w} V${h*.75} H${w*.35} L${w*.2},${h} V${h*.75} H0 Z" ${a}/>`,
  };
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${P[e.shape]||P.rect}</svg>`;
}
function chartSVG(e,t){
  const w=e.w,h=e.h,vals=e.values,labs=e.labels,col=e.colors||[t.accent,'#2457c5','#2f7a3e','#f0a35e','#6b3fa0','#e85d9a','#7fd1e8','#9aa1ad'];const fg=e.color||t.fg;let s=`<svg viewBox="0 0 ${w} ${h}" style="font-family:'${t.font}';width:100%;height:100%"><text x="${w/2}" y="24" text-anchor="middle" font-size="20" font-weight="600" fill="${fg}">${esc(e.title||'')}</text>`;
  const max=Math.max(...vals,1),pl=50,pt=40,pb=40,pr=20,cw=w-pl-pr,ch=h-pt-pb;
  if(e.ctype==='pie'){const tot=vals.reduce((a,b)=>a+b,0)||1;let a0=-Math.PI/2;const cx=w/2-80,cy=pt+ch/2,r=Math.min(cw,ch)/2.2;vals.forEach((v,i)=>{const a1=a0+v/tot*2*Math.PI;const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);s+=`<path d="M${cx},${cy} L${x0},${y0} A${r},${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1},${y1} Z" fill="${col[i%col.length]}"/>`;s+=`<rect x="${cx+r+30}" y="${pt+i*24}" width="14" height="14" fill="${col[i%col.length]}"/><text x="${cx+r+50}" y="${pt+i*24+12}" font-size="14" fill="${fg}">${esc(labs[i]||'')} (${Math.round(v/tot*100)}%)</text>`;a0=a1;});return s+'</svg>';}
  for(let i=0;i<=4;i++){const y=pt+ch-ch*i/4;s+=`<line x1="${pl}" x2="${w-pr}" y1="${y}" y2="${y}" stroke="${fg}" stroke-opacity=".15"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="12" fill="${fg}">${Math.round(max*i/4)}</text>`;}
  const n=vals.length,bw=cw/n;
  if(e.ctype==='line'){const pts=vals.map((v,i)=>`${pl+bw*i+bw/2},${pt+ch-v/max*ch}`);s+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${col[0]}" stroke-width="3"/>`;vals.forEach((v,i)=>s+=`<circle cx="${pl+bw*i+bw/2}" cy="${pt+ch-v/max*ch}" r="5" fill="${col[0]}"/>`);}
  else vals.forEach((v,i)=>{s+=`<rect x="${pl+bw*i+bw*.15}" y="${pt+ch-v/max*ch}" width="${bw*.7}" height="${v/max*ch}" fill="${col[i%col.length]}" rx="3"/>`;});
  labs.forEach((l,i)=>s+=`<text x="${pl+bw*i+bw/2}" y="${h-pb+18}" text-anchor="middle" font-size="13" fill="${fg}">${esc(l)}</text>`);
  return s+'</svg>';
}
function render(){
  const s=S();const {bg,h}=slideHTML(s);slide.style.background=bg;slide.innerHTML=h+(gridOn?'<div style="position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px);background-size:40px 40px"></div>':'');
  sel.forEach(id=>{const d=slide.querySelector(`[data-id="${id}"]`);if(d)markSel(d);});
  document.getElementById('notes').value=s.notes||'';renderProps();applyZoom();
}
function markSel(d){d.classList.add('sel');if(sel.length===1)['nw','ne','sw','se','n','s','w','e','rot'].forEach(k=>{const h=document.createElement('div');h.className='h '+k;h.dataset.h=k;d.appendChild(h);});}
function renderFilm(){
  const f=document.getElementById('film');f.innerHTML='';
  cur.slides.forEach((s,i)=>{const d=document.createElement('div');d.className='thumb'+(i===si?' active':'');d.draggable=true;d.dataset.i=i;const {bg,h}=slideHTML(s,true);d.innerHTML=`<span class="n">${i+1}</span><div class="tv"><div class="slide" style="background:${bg};transform:scale(${(170)/960});box-shadow:none">${h}</div></div>`;
    d.onclick=()=>{save();si=i;sel=[];render();renderFilm();};
    d.addEventListener('dragstart',e=>{e.dataTransfer.setData('i',i);d.classList.add('drag');});d.addEventListener('dragend',()=>d.classList.remove('drag'));d.addEventListener('dragover',e=>e.preventDefault());
    d.addEventListener('drop',e=>{e.preventDefault();const from=+e.dataTransfer.getData('i');if(from===i)return;snap();const [m]=cur.slides.splice(from,1);cur.slides.splice(i,0,m);si=i;commit();render();});
    d.oncontextmenu=e=>{e.preventDefault();si=i;render();renderFilm();ctxMenu(e,[['New slide',()=>cmds['new-slide']()],['Duplicate slide',()=>cmds['dup-slide']()],['Delete slide',()=>cmds['del-slide']()],['Move up',()=>cmds['slide-up']()],['Move down',()=>cmds['slide-down']()]]);};
    f.appendChild(d);});
  const t=document.getElementById('film').querySelector('.active');if(t)t.scrollIntoView({block:'nearest'});
}
function applyZoom(){const w=document.getElementById('wrap');let z=zoom;if(zoom==='fit'){z=Math.min((w.clientWidth-16)/960,(w.clientHeight-16)/540);}slide._z=z;if(matchMedia('(max-width:1000px)').matches){w.style.position='relative';slide.style.position='absolute';slide.style.transformOrigin='0 0';slide.style.margin='0';slide.style.left=Math.max(0,(w.clientWidth-960*z)/2)+'px';slide.style.top=Math.max(0,(w.clientHeight-540*z)/2)+'px';slide.style.transform=`scale(${z})`;}else{w.style.position='';slide.style.position='';slide.style.transformOrigin='';slide.style.left='';slide.style.top='';slide.style.transform=`scale(${z})`;slide.style.margin=`${(540*z-540)/2}px ${(960*z-960)/2}px`;}}
window.addEventListener('resize',applyZoom);
document.getElementById('zoom').onchange=e=>{zoom=e.target.value==='fit'?'fit':+e.target.value;applyZoom();};

/* ===== props panel ===== */
function renderProps(){
  const p=document.getElementById('props');const t=T();
  if(!sel.length){p.innerHTML=`<h3>Theme</h3><div class="themes">${Object.entries(THEMES).map(([k,v])=>`<button data-theme="${k}" style="background:${v.bg};color:${v.fg};border-color:${k===cur.theme?'var(--accent)':'var(--line)'}"><b style="color:${v.accent}">●</b> ${v.name}</button>`).join('')}</div>

document.addEventListener('keydown',e=>{
  if(document.getElementById('show').classList.contains('on'))return;
  const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey,inField=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||editing;
  if(e.key==='Escape'){if(editing)stopEdit();else{sel=[];render();}closeMenus();return;}
  if(c&&k==='s'){e.preventDefault();save();toast('Saved');return;}
  if(c&&k==='m'){e.preventDefault();cmds['new-slide']();return;}
  if(c&&k==='z'&&!inField){e.preventDefault();e.shiftKey?cmds.redo():cmds.undo();return;}
  if(c&&k==='y'&&!inField){e.preventDefault();cmds.redo();return;}
  if(e.key==='F5'){e.preventDefault();present(e.shiftKey?si:0);return;}
  if(inField){if(c&&k==='b'){e.preventDefault();ex('bold');}if(c&&k==='i'){e.preventDefault();ex('italic');}if(c&&k==='u'){e.preventDefault();ex('underline');}return;}
  if(c&&k==='c')cmds.copy();else if(c&&k==='v'){}else if(c&&k==='d'){e.preventDefault();cmds.duplicate();}else if(c&&k==='a'){e.preventDefault();cmds['select-all']();}else if(c&&k==='g'){e.preventDefault();e.shiftKey?cmds.ungroup():cmds.group();}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();cmds.delete();}
  else if(e.key.startsWith('Arrow')&&sel.length){e.preventDefault();snap();const d=e.shiftKey?10:1;sel.forEach(id=>{const x=findEl(id);if(e.key==='ArrowLeft')x.x-=d;if(e.key==='ArrowRight')x.x+=d;if(e.key==='ArrowUp')x.y-=d;if(e.key==='ArrowDown')x.y+=d;});commit();render();}

  else if(e.key==='Enter'&&sel.length===1){const x=slide.querySelector(`[data-id="${sel[0]}"].text`);if(x){e.preventDefault();startEdit(x);}}
});

/* ===== presenting ===== */
function present(from){
  const show=document.getElementById('show');show.classList.add('on');let i=from,step=0;const t=T();
  const sd=document.createElement('div');sd.className='slide';show.prepend(sd);
  function fit(){const z=Math.min(innerWidth/960,innerHeight/540);sd.style.transform=`scale(${z})`;}fit();window.addEventListener('resize',fit);
  function draw(dir=1){const s=cur.slides[i];const {bg,h}=slideHTML(s,true);sd.style.background=bg;sd.innerHTML=h;step=0;
    sd.querySelectorAll('.el').forEach(d=>{const e=findEl(d.dataset.id,s.els);if(e&&e.anim)d.style.visibility='hidden';});
    const tr=s.trans||'none';if(tr!=='none'){sd.animate(tr==='fade'?[{opacity:0},{opacity:1}]:tr==='zoom'?[{transform:sd.style.transform+' scale(.8)',opacity:0},{transform:sd.style.transform,opacity:1}]:[{transform:`translateX(${dir*100}%) `+sd.style.transform,opacity:0},{transform:sd.style.transform,opacity:1}],{duration:400,easing:'ease-out'});}
    document.getElementById('hud').textContent=`${i+1} / ${cur.slides.length}`;
    if(presenterWin&&!presenterWin.closed)presenterWin.postMessage({i,notes:s.notes,next:cur.slides[i+1]?slideHTML(cur.slides[i+1],true):null},'*');}
  function next(){const s=cur.slides[i];const hidden=[...sd.querySelectorAll('.el')].filter(d=>d.style.visibility==='hidden');if(hidden.length){const d=hidden[0];const e=findEl(d.dataset.id,s.els);d.style.visibility='';const a=e.anim;d.animate(a==='fade'?[{opacity:0},{opacity:1}]:a==='up'?[{transform:`translateY(80px)`,opacity:0},{transform:'translateY(0)',opacity:1}]:a==='left'?[{transform:`translateX(-80px)`,opacity:0},{transform:'translateX(0)',opacity:1}]:[{transform:'scale(.5)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:400,easing:'ease-out'});return;}
    if(i<cur.slides.length-1){i++;draw(1);}}
  function prev(){if(i>0){i--;draw(-1);}}
  function end(){show.classList.remove('on');sd.remove();document.removeEventListener('keydown',key);show.onclick=null;show.onmousemove=null;window.removeEventListener('resize',fit);window.removeEventListener('message',msg);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});si=i;render();renderFilm();}
  function key(e){const k=e.key;if(k==='Escape')end();else if(['ArrowRight','ArrowDown',' ','PageDown','Enter'].includes(k)){e.preventDefault();next();}else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){e.preventDefault();prev();}else if(k==='Home'){i=0;draw();}else if(k==='End'){i=cur.slides.length-1;draw();}else if(k.toLowerCase()==='l'){const l=document.getElementById('laser');l.style.display=l.style.display==='block'?'none':'block';}else if(k.toLowerCase()==='b'){sd.style.visibility=sd.style.visibility==='hidden'?'':'hidden';}else if(k.toLowerCase()==='p'){openPresenter();}else if(/^[0-9]$/.test(k)){const n=+k-1;if(cur.slides[n]){i=n;draw();}}}
  function msg(e){if(e.data==='next')next();if(e.data==='prev')prev();}
  document.addEventListener('keydown',key);window.addEventListener('message',msg);
  show.onclick=e=>{if(e.target.closest('.hud'))return;e.clientX<innerWidth*.2?prev():next();};
  show.onmousemove=e=>{const l=document.getElementById('laser');l.style.left=e.clientX-6+'px';l.style.top=e.clientY-6+'px';};
  show.requestFullscreen?.().catch(()=>{});draw();toast('← → navigate · B blank · L laser · P presenter view · Esc exit');
}

  const hex=c=>{if(!c||c==='none'||c==='transparent')return null;if(c.startsWith('#'))return c.slice(1).toUpperCase();const m=c.match(/\d+/g);return m?m.slice(0,3).map(v=>(+v).toString(16).padStart(2,'0')).join('').toUpperCase():null;};

let aiRes=null,aiMode='deck';
cmds['ai-settings']=()=>{const d=document.getElementById('dlg-aiset');d.innerHTML=AI.settingsHTML();AI.bindSettings(d);d.showModal();};
cmds.ai=()=>{if(!AI.ready()){cmds['ai-settings']();return;}document.getElementById('aiOut').style.display='none';document.getElementById('aiApply').style.display='none';document.getElementById('dlg-ai').showModal();};
document.getElementById('aiQuick').onclick=e=>{const b=e.target.closest('[data-q]');if(!b)return;aiMode=b.dataset.q;const p=document.getElementById('aiPrompt');if(aiMode==='deck'||aiMode==='slide'){p.placeholder=aiMode==='deck'?'Topic, audience, number of slides…':'What should the new slide be about?';p.focus();}else document.getElementById('aiRun').click();};
const slideText=s=>s.els.filter(e=>e.type==='text').map(e=>{const d=document.createElement('div');d.innerHTML=e.html;return d.innerText;}).join('\n');
document.getElementById('aiRun').onclick=async()=>{const q=document.getElementById('aiPrompt').value.trim();const out=document.getElementById('aiOut');out.style.display='block';out.textContent='Thinking…';document.getElementById('aiApply').style.display='none';
  try{if(aiMode==='deck'||aiMode==='slide'||aiMode==='outline'){const n=aiMode==='slide'?1:null;const r=await AI.ask('You create presentation outlines. Respond with JSON only: {"slides":[{"title":string,"bullets":[string,...],"notes":string}]}. Bullets are short (max 12 words). Notes are 2-3 spoken sentences.',`${aiMode==='slide'?'Create exactly one slide':'Create a deck (default 6-8 slides, first is a title slide with 0 bullets, last is a closing slide)'} about: ${q||'(no topic given — pick something sensible from the existing deck: '+cur.slides.map(slideText).join(' / ').slice(0,1500)+')'}`,{json:true,max:3000});aiRes=AI.parseJSON(r).slides;out.textContent=aiRes.map((s,i)=>`${i+1}. ${s.title}\n   ${(s.bullets||[]).join('\n   ')}`).join('\n');}
    else{const txt=slideText(S());const inst={notes:'Write speaker notes (4-6 spoken sentences) for this slide. Respond with JSON: {"notes": string}',improve:'Improve the wording on this slide: clearer, more compelling, same language, same number of text blocks. Respond with JSON: {"texts":[string,...]} one entry per text block, as simple HTML (use <ul><li> for bullets).',shorten:'Condense this slide into at most 4 crisp bullets per text block. Respond with JSON: {"texts":[string,...]} one per text block, simple HTML.',translate:'Translate every text block on this slide to Hebrew. Respond with JSON: {"texts":[string,...]} one per text block, simple HTML, keep bullets.'}[aiMode];const blocks=S().els.filter(e=>e.type==='text').map(e=>e.html);const r=await AI.ask(inst,`SLIDE TEXT BLOCKS (HTML):\n${blocks.map((b,i)=>`[${i+1}] ${b}`).join('\n')}\n${q?'EXTRA INSTRUCTION: '+q:''}`,{json:true,max:2000});aiRes=AI.parseJSON(r);out.textContent=aiRes.notes||(aiRes.texts||[]).map(t=>t.replace(/<[^>]+>/g,' ')).join('\n— — —\n');}
    document.getElementById('aiApply').style.display='';}catch(e){out.textContent='Error: '+e.message;}};
document.getElementById('aiApply').onclick=()=>{document.getElementById('dlg-ai').close();if(Array.isArray(aiRes)){addSlidesFrom(aiRes.map(s=>({title:s.title,bullets:s.bullets||[],notes:s.notes})));if(aiMode==='deck'&&cur.slides.length>aiRes.length&&cur.slides[0].els.length<=2&&slideText(cur.slides[0]).includes('Presentation title')){cur.slides.splice(0,1);si=Math.max(0,si-1);}const first=cur.slides[si-aiRes.length+1];if(aiMode==='deck'&&first&&!(aiRes[0].bullets||[]).length){const t=newSlide('title');t.els[0].html=esc(aiRes[0].title);t.els[1].html=esc(aiRes[0].notes?.split('.')[0]||'');t.notes=aiRes[0].notes||'';cur.slides.splice(cur.slides.indexOf(first),1,t);}commit();render();}
  else if(aiRes.notes){snap();S().notes=aiRes.notes;commit();render();}else if(aiRes.texts){snap();const ts=S().els.filter(e=>e.type==='text');aiRes.texts.forEach((t,i)=>{if(ts[i])ts[i].html=t;});commit();render();}toast('Applied');};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='j'){e.preventDefault();cmds.ai();}});
/* pptx export additions: icons/video/shape text */
/* ===== mobile ===== */
const isMobile=()=>matchMedia('(max-width:1000px)').matches;
document.getElementById('propsBtn').onclick=()=>document.getElementById('props').classList.toggle('open');
document.getElementById('wrap').addEventListener('pointerdown',e=>{if(!e.target.closest('.props'))document.getElementById('props').classList.remove('open');});
if(isMobile()){zoom='fit';document.getElementById('zoom').value='fit';}
let lp;slide.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;clearTimeout(lp);const x=e.clientX,y=e.clientY;lp=setTimeout(()=>{drag=null;slide.dispatchEvent(new MouseEvent('contextmenu',{clientX:x,clientY:y,bubbles:true}));},550);});
['pointermove','pointerup','pointercancel'].forEach(ev=>slide.addEventListener(ev,e=>{if(ev==='pointermove'&&drag&&Math.abs(e.clientX-drag.sx)<6&&Math.abs(e.clientY-drag.sy)<6)return;clearTimeout(lp);}));
// tap an already-selected text box to edit (no dblclick on touch)
let lastTap=null;slide.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;const d=e.target.closest('.el.text');const id=d?d.dataset.id:null;if(d&&lastTap===id&&drag&&!drag.moved){startEdit(d);lastTap=null;return;}lastTap=id;});
window.addEventListener('resize',()=>{if(zoom==='fit')applyZoom();});
/* ===== init ===== */
document.documentElement.dataset.theme=localStorage.getItem('slides.theme')||'';
cmds['open-list']=()=>{const l=document.getElementById('presList');l.innerHTML=pres.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>${esc(p.name)}<br><small style="color:var(--muted)">${p.slides.length} slides · ${new Date(p.updated).toLocaleString()}</small></span><button data-open="${p.id}" style="color:var(--accent)">Open</button></div>`).join('')||'<div class="empty">No presentations yet.</div>';l.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{document.getElementById('dlg-presets').close();save();load(b.dataset.open);});document.getElementById('dlg-presets').showModal();};
document.getElementById('m-file').querySelector('ul').insertAdjacentHTML('afterbegin','<li><button data-cmd="open-list">Your presentations…</button></li>');
if(!pres.length)newPres('My first presentation');else load(localStorage.getItem('slides.last')||pres[0].id);
</script>
</body>
